[mypy]
python_version = 3.12
warn_return_any = False
warn_unused_configs = True
ignore_missing_imports = True
exclude = desktop|scripts|desktop\dist

[mypy-core.*]
ignore_errors = True

[mypy-modules.*]
ignore_errors = True

[mypy-server.*]
ignore_errors = True

[mypy-tests.*]
ignore_errors = True

[mypy-tests.unit.*]
ignore_errors = True

[mypy-tests.e2e.*]
ignore_errors = True

[mypy-tests.integration.*]
ignore_errors = True

[mypy-modules.*]
ignore_errors = True

[mypy-server.*]
ignore_errors = True

[mypy-tests.*]
ignore_errors = True

[mypy-tests.unit.*]
ignore_errors = True

[mypy-tests.e2e.*]
ignore_errors = True

[mypy-tests.integration.*]
ignore_errors = True

# Disable strict mode options that cause excessive errors
disallow_untyped_defs = False
disallow_incomplete_defs = False
check_untyped_defs = False
disallow_untyped_decorators = False

# Allow implicit Optional
no_implicit_optional = False

# Report errors for key issues but skip noisy ones
warn_redundant_casts = True
warn_unused_ignores = True
show_error_codes = True

[mypy-core.*]
ignore_errors = True

[mypy-modules.*]
ignore_errors = True

[mypy-server.*]
ignore_errors = True

[mypy-tests.*]
ignore_errors = True