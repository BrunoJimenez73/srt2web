<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRT2Web — Live Player</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        #video-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        #video-player {
            width: 100%;
            height: 100%;
            background-color: #000;
            object-fit: contain;
        }

        ::cue {
            background-color: rgba(0, 0, 0, 0.8) !important;
            color: #fff !important;
            font-family: 'Inter', system-ui, sans-serif;
            font-size: 1.2em !important;
            font-weight: 500;
            padding: 4px 8px;
        }
        
        /* Ensure text tracks are visible */
        video::-webkit-media-text-track-display {
            background-color: rgba(0, 0, 0, 0.8) !important;
        }

        .waiting-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255,255,255,0.6);
            font-family: 'Inter', system-ui, sans-serif;
            text-align: center;
            pointer-events: none;
            font-size: 18px;
        }


    </style>
</head>
<body>

    <div id="video-container">
        <video id="video-player" controls autoplay playsinline crossorigin="anonymous"></video>
        <div id="waiting" class="waiting-text">Esperando stream...</div>
    </div>

    <!-- HLS.js for handling the stream -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.1"></script>
    <script>
        let hls = null;
        let userPreference = null; // null = no user preference yet, true = enabled, false = disabled
        let subtitleTrackElement = null; // Reference to the track element
        let subtitleLanguageName = 'Italiano'; // Default, will be updated from HLS manifest
        const video = document.getElementById('video-player');
        const waiting = document.getElementById('waiting');

        // Load subtitles - refresh periodically for live sync without reloading video
        async function loadVTT() {
            try {
                const response = await fetch('/hls/subs.vtt?_=' + Date.now());
                if (!response.ok) return;
                
                const vttContent = await response.text();
                
                // Check if content changed
                if (window.lastVTTContent === vttContent) return;
                window.lastVTTContent = vttContent;
                
                console.log('VTT content changed, updating track');
                
                // Create or update blob URL with explicit UTF-8 encoding
                const vttBlob = new Blob([vttContent], { type: 'text/vtt; charset=utf-8' });
                const vttUrl = URL.createObjectURL(vttBlob);
                
                if (subtitleTrackElement) {
                    // Update existing track
                    const oldSrc = subtitleTrackElement.src;
                    subtitleTrackElement.src = vttUrl;
                    
                    // Revoke old blob URL if it was a blob URL
                    if (oldSrc && oldSrc.startsWith('blob:')) {
                        URL.revokeObjectURL(oldSrc);
                    }
                    
                    console.log('Updated subtitle track with new VTT content');
                } else {
                    // Create new track
                    subtitleTrackElement = document.createElement('track');
                    subtitleTrackElement.kind = 'subtitles';
                    subtitleTrackElement.label = subtitleLanguageName;
                    subtitleTrackElement.srclang = 'it'; // Default, will be updated if we get language code from HLS
                    subtitleTrackElement.src = vttUrl;
                    subtitleTrackElement.default = true;
                    
                    video.appendChild(subtitleTrackElement);
                    
                    subtitleTrackElement.addEventListener('load', () => {
                        console.log('Subtitle track loaded for the first time');
                        // Apply user preference if set, otherwise default to showing
                        const shouldShow = userPreference !== null ? userPreference : true;
                        
                        if (shouldShow) {
                            for (let i = 0; i < video.textTracks.length; i++) {
                                if (video.textTracks[i].kind === 'subtitles') {
                                    video.textTracks[i].mode = 'showing';
                                    console.log('Set subtitle track to showing');
                                }
                            }
                        }
                    });
                }
                
            } catch(e) {
                console.log('VTT load error:', e);
            }
        }
        
        // Load subtitles every 5 seconds for live sync
        setInterval(loadVTT, 5000);
        loadVTT(); // Load immediately

        function initPlayer() {
            if (Hls.isSupported()) {
                hls = new Hls({
                    enableWorker: true,
                    lowLatencyMode: false,
                    backBufferLength: 90
                });

                // Load master playlist which includes subtitle references
                hls.loadSource('/hls/master.m3u8');
                hls.attachMedia(video);

                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    video.play().catch(() => {});
                    waiting.style.display = 'none';
                    
                    console.log('Manifest parsed. Subtitle tracks:', hls.subtitleTracks);
                    
                    // Get subtitle language info from HLS manifest
                    if (hls.subtitleTracks.length > 0) {
                        const firstTrack = hls.subtitleTracks[0];
                        console.log('First subtitle track:', firstTrack);
                        if (firstTrack.name) {
                            subtitleLanguageName = firstTrack.name;
                            console.log('Subtitle language from manifest:', subtitleLanguageName);
                        }
                        // Also try to get language code if available
                        if (firstTrack.lang) {
                            console.log('Subtitle language code:', firstTrack.lang);
                            // Update srclang if we have a language code
                            if (subtitleTrackElement) {
                                subtitleTrackElement.srclang = firstTrack.lang;
                            }
                        }
                    }
                    
                    // Note: We handle subtitles manually via loadVTT() function
                    // HLS.js subtitle tracks are ignored to avoid conflicts
                });

                hls.on(Hls.Events.ERROR, (e, data) => {
                    console.log('HLS Error:', data.type, data.details);
                    if (data.fatal) {
                        switch (data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                hls.startLoad();
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                hls.recoverMediaError();
                                break;
                        }
                    }
                });
                
                // Debug subtitle track events
                hls.on(Hls.Events.SUBTITLE_TRACKS_UPDATED, (event, data) => {
                    console.log('Subtitle tracks updated:', data);
                });
                
                hls.on(Hls.Events.SUBTITLE_TRACK_SWITCH, (event, data) => {
                    console.log('Subtitle track switched:', data);
                });
                
                hls.on(Hls.Events.SUBTITLE_FRAG_PROCESSED, (event, data) => {
                    console.log('Subtitle fragment processed:', data);
                });
                
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = '/hls/master.m3u8';
            }
        }

        // Listen for user changes to subtitle mode via native controls
        function setupSubtitleChangeListener() {
            // Listen for mode changes on all text tracks
            const setupTrackListeners = () => {
                for (let i = 0; i < video.textTracks.length; i++) {
                    const track = video.textTracks[i];
                    if (track.kind === 'subtitles') {
                        // Remove any existing listeners to avoid duplicates
                        track.removeEventListener('modechange', handleModeChange);
                        // Add new listener
                        track.addEventListener('modechange', handleModeChange);
                    }
                }
            };
            
            const handleModeChange = (event) => {
                const track = event.target;
                if (track.kind === 'subtitles') {
                    // Update user preference based on current mode
                    userPreference = track.mode === 'showing';
                    console.log('Subtitle mode changed to:', track.mode, '(userPreference:', userPreference + ')');
                }
            };
            
            // Setup listeners when text tracks are available
            if (video.textTracks.length > 0) {
                setupTrackListeners();
            } else {
                // Wait for tracks to be added
                video.addEventListener('loadedmetadata', setupTrackListeners);
            }
            
            // Also check periodically in case tracks are recreated
            setInterval(setupTrackListeners, 2000);
        }

        // Wait for page load then init
        document.addEventListener('DOMContentLoaded', () => {
            loadVTT(); // Load subtitles immediately
            initPlayer();
            setupSubtitleChangeListener();
            
            // Retry init every few seconds until stream appears
            const checkInterval = setInterval(() => {
                if (!hls || hls.state === 'ERROR') {
                    initPlayer();
                }
            }, 5000);
        });
    </script>
</body>
</html>
