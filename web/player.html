<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRT2Web — Live Player</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        #video-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        #video-player {
            width: 100%;
            height: 100%;
            background-color: #000;
            object-fit: contain;
        }

        ::cue {
            background-color: rgba(0, 0, 0, 0.8) !important;
            color: #fff !important;
            font-family: 'Inter', system-ui, sans-serif;
            font-size: 1em !important;
            font-weight: 500;
            padding: 4px 8px;
        }

        .waiting-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255,255,255,0.6);
            font-family: 'Inter', system-ui, sans-serif;
            text-align: center;
            pointer-events: none;
            font-size: 18px;
        }


    </style>
</head>
<body>

    <div id="video-container">
        <video id="video-player" controls autoplay playsinline crossorigin="anonymous"></video>
        <div id="waiting" class="waiting-text">Esperando stream...</div>
    </div>

    <!-- HLS.js for handling the stream -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.1"></script>
    <script>
        let hls = null;
        let subtitlesEnabled = true; // Enabled by default
        let subtitleTrack = null;
        const video = document.getElementById('video-player');
        const waiting = document.getElementById('waiting');

        // Load subtitles - refresh periodically for live sync without reloading video
        async function loadVTT() {
            try {
                const response = await fetch('/hls/subs.vtt?_=' + Date.now());
                if (!response.ok) return;
                
                const vttContent = await response.text();
                
                // Check if content changed
                if (window.lastVTTContent === vttContent) return;
                window.lastVTTContent = vttContent;
                
                // Create blob URL
                const vttBlob = new Blob([vttContent], { type: 'text/vtt' });
                const vttUrl = URL.createObjectURL(vttBlob);
                
                // Remove old subtitle tracks properly
                for (let i = video.textTracks.length - 1; i >= 0; i--) {
                    video.textTracks[i].mode = 'hidden';
                }
                
                // Find and remove track elements and revoke old blob URLs
                const oldTracks = video.querySelectorAll('track');
                oldTracks.forEach(track => {
                    if (track.kind === 'subtitles' && track.src) {
                        // Revoke the old blob URL to prevent memory leaks
                        if (track.src.startsWith('blob:')) {
                            URL.revokeObjectURL(track.src);
                        }
                        track.parentNode.removeChild(track);
                    }
                });
                
                const track = document.createElement('track');
                track.kind = 'subtitles';
                track.label = 'Spanish';
                track.srclang = 'es';
                track.src = vttUrl;
                track.default = true;
                
                video.appendChild(track);
                
                track.addEventListener('load', () => {
                    if (subtitlesEnabled) {
                        for (let i = 0; i < video.textTracks.length; i++) {
                            if (video.textTracks[i].kind === 'subtitles') {
                                video.textTracks[i].mode = 'showing';
                            }
                        }
                    }
                });
                
            } catch(e) {
                console.log('VTT load error:', e);
            }
        }
        
        // Refresh subtitles every 5 seconds for live sync
        setInterval(loadVTT, 5000);
        loadVTT(); // Load immediately

        function initPlayer() {
            if (Hls.isSupported()) {
                hls = new Hls({
                    enableWorker: true,
                    lowLatencyMode: false,
                    backBufferLength: 90
                });

                // Load master playlist which includes subtitle references
                hls.loadSource('/hls/master.m3u8');
                hls.attachMedia(video);

                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    video.play().catch(() => {});
                    waiting.style.display = 'none';
                    
                    // Enable subtitle track via HLS.js
                    if (hls.subtitleTracks.length > 0) {
                        hls.subtitleTrack = 0;
                    }
                });

                hls.on(Hls.Events.ERROR, (e, data) => {
                    console.log('HLS Error:', data.type, data.details);
                    if (data.fatal) {
                        switch (data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                hls.startLoad();
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                hls.recoverMediaError();
                                break;
                        }
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = '/hls/master.m3u8';
            }
        }

        // Wait for page load then init
        document.addEventListener('DOMContentLoaded', () => {
            loadVTT(); // Load subtitles immediately
            initPlayer();
            
            // Retry init every few seconds until stream appears
            const checkInterval = setInterval(() => {
                if (!hls || hls.state === 'ERROR') {
                    initPlayer();
                }
            }, 5000);
        });
    </script>
</body>
</html>
