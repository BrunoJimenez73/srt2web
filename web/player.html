<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRT2Web — Live Player</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        #video-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        #video-player {
            width: 100%;
            height: 100%;
            background-color: #000;
            object-fit: contain;
        }

        /* Subtitle styling */
        ::cue {
            background-color: transparent !important;
            text-shadow: 
                -2px -2px 0 #000,  
                 2px -2px 0 #000,
                -2px  2px 0 #000,
                 2px  2px 0 #000,
                 0px  4px 10px rgba(0,0,0,0.8);
            font-family: 'Inter', system-ui, sans-serif;
            font-size: 1.5em;
            font-weight: 700;
            color: #fff;
        }
        
        .waiting-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255,255,255,0.6);
            font-family: 'Inter', system-ui, sans-serif;
            text-align: center;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="video-container">
        <video id="video-player" controls autoplay playsinline></video>
    </div>

    <!-- HLS.js for handling the stream -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const video = document.getElementById('video-player');
            const hlsUrl = '/hls/master.m3u8';
            let hls = null;
            let checkInterval = null;

            function initPlayer() {
                if (Hls.isSupported()) {
                    if (hls) hls.destroy();
                    
                    hls = new Hls({
                        liveSyncDurationCount: 6, // 24 seconds delay for maximum stability
                        liveMaxLatencyDurationCount: 12,
                        maxBufferLength: 30,
                        enableWorker: true,
                        lowLatencyMode: true,
                    });

                    hls.loadSource(hlsUrl);
                    hls.attachMedia(video);
                    
                    hls.on(Hls.Events.MANIFEST_PARSED, function() {
                        video.play().catch(e => {});
                    });

                    hls.on(Hls.Events.SUBTITLE_TRACKS_UPDATED, function(event, data) {
                        if (data.subtitleTracks.length > 0) {
                            hls.subtitleTrack = 0;
                            // Ensure tracks are enabled
                            for (let i = 0; i < video.textTracks.length; i++) {
                                video.textTracks[i].mode = 'showing';
                            }
                        }
                    });

                    hls.on(Hls.Events.ERROR, function (event, data) {
                        if (data.fatal) {
                            switch (data.type) {
                                case Hls.ErrorTypes.NETWORK_ERROR:
                                    console.log("Network error, retrying...");
                                    hls.startLoad();
                                    break;
                                case Hls.ErrorTypes.MEDIA_ERROR:
                                    hls.recoverMediaError();
                                    break;
                                default:
                                    initPlayer();
                                    break;
                            }
                        }
                    });
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = hlsUrl;
                }
            }

            // Continuously check if the stream exists by doing a HEAD request
            function checkStream() {
                fetch(hlsUrl, { method: 'HEAD' })
                    .then(response => {
                        if (response.ok) {
                            // Stream is up
                            if (!hls || !document.querySelector('video').src) {
                                initPlayer();
                            }
                            clearInterval(checkInterval);
                        }
                    })
                    .catch(() => {
                        // Keep trying
                    });
            }

            // Start checking
            checkInterval = setInterval(checkStream, 2000);
            checkStream(); // Check immediately
        });
    </script>
</body>
</html>
