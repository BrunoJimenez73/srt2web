<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRT2Web — Live Player</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        #video-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        #video-player {
            width: 100%;
            height: 100%;
            background-color: #000;
            object-fit: contain;
        }

        ::cue {
            background-color: rgba(0, 0, 0, 0.8) !important;
            color: #fff !important;
            font-family: 'Inter', system-ui, sans-serif;
            font-size: 1em !important;
            font-weight: 500;
            padding: 4px 8px;
        }

        .waiting-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255,255,255,0.6);
            font-family: 'Inter', system-ui, sans-serif;
            text-align: center;
            pointer-events: none;
            font-size: 18px;
        }


    </style>
</head>
<body>

    <div id="video-container">
        <video id="video-player" controls autoplay playsinline crossorigin="anonymous"></video>
        <div id="waiting" class="waiting-text">Esperando stream...</div>
    </div>

    <!-- HLS.js for handling the stream -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.1"></script>
    <script>
        let hls = null;
        let userPreference = null; // null = no user preference yet, true = enabled, false = disabled
        const video = document.getElementById('video-player');
        const waiting = document.getElementById('waiting');

        // Load subtitles - refresh periodically for live sync without reloading video
        // Note: We now let HLS.js handle subtitles from the master playlist
        // This function just ensures the VTT file is being updated on the server
        async function checkVTTUpdate() {
            try {
                const response = await fetch('/hls/subs.vtt?_=' + Date.now());
                if (!response.ok) return;
                
                const vttContent = await response.text();
                
                // Check if content changed (just to track updates)
                if (window.lastVTTContent === vttContent) return;
                window.lastVTTContent = vttContent;
                
                // VTT content changed - HLS.js should handle the update automatically
                // when it reloads the subtitle track from the master playlist
                
            } catch(e) {
                console.log('VTT check error:', e);
            }
        }
        
        // Check VTT updates every 5 seconds for live sync
        setInterval(checkVTTUpdate, 5000);
        checkVTTUpdate(); // Check immediately

        function initPlayer() {
            if (Hls.isSupported()) {
                hls = new Hls({
                    enableWorker: true,
                    lowLatencyMode: false,
                    backBufferLength: 90
                });

                // Load master playlist which includes subtitle references
                hls.loadSource('/hls/master.m3u8');
                hls.attachMedia(video);

                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    video.play().catch(() => {});
                    waiting.style.display = 'none';
                    
                    // Enable subtitle track via HLS.js
                    if (hls.subtitleTracks.length > 0) {
                        hls.subtitleTrack = 0;
                        
                        // Apply user preference if set
                        setTimeout(() => {
                            if (userPreference !== null && !userPreference) {
                                // User wants subtitles disabled
                                for (let i = 0; i < video.textTracks.length; i++) {
                                    if (video.textTracks[i].kind === 'subtitles') {
                                        video.textTracks[i].mode = 'hidden';
                                        break;
                                    }
                                }
                            }
                        }, 1000);
                    }
                });

                hls.on(Hls.Events.ERROR, (e, data) => {
                    console.log('HLS Error:', data.type, data.details);
                    if (data.fatal) {
                        switch (data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                hls.startLoad();
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                hls.recoverMediaError();
                                break;
                        }
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = '/hls/master.m3u8';
            }
        }

        // Listen for user changes to subtitle mode via native controls
        function setupSubtitleChangeListener() {
            // Listen for mode changes on all text tracks
            const setupTrackListeners = () => {
                for (let i = 0; i < video.textTracks.length; i++) {
                    const track = video.textTracks[i];
                    if (track.kind === 'subtitles') {
                        // Remove any existing listeners to avoid duplicates
                        track.removeEventListener('modechange', handleModeChange);
                        // Add new listener
                        track.addEventListener('modechange', handleModeChange);
                    }
                }
            };
            
            const handleModeChange = (event) => {
                const track = event.target;
                if (track.kind === 'subtitles') {
                    // Update user preference based on current mode
                    userPreference = track.mode === 'showing';
                    console.log('Subtitle mode changed to:', track.mode, '(userPreference:', userPreference + ')');
                }
            };
            
            // Setup listeners when text tracks are available
            if (video.textTracks.length > 0) {
                setupTrackListeners();
            } else {
                // Wait for tracks to be added
                video.addEventListener('loadedmetadata', setupTrackListeners);
            }
            
            // Also check periodically in case tracks are recreated
            setInterval(setupTrackListeners, 2000);
        }

        // Wait for page load then init
        document.addEventListener('DOMContentLoaded', () => {
            checkVTTUpdate(); // Check VTT update immediately
            initPlayer();
            setupSubtitleChangeListener();
            
            // Retry init every few seconds until stream appears
            const checkInterval = setInterval(() => {
                if (!hls || hls.state === 'ERROR') {
                    initPlayer();
                }
            }, 5000);
        });
    </script>
</body>
</html>
