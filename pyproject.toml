[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "srt2web"
version = "0.6.8"
description = "Real-time SRT streaming processor with Web dashboard"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = {text = "MIT"}
authors = [
    {name = "BrunoJimenez73"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pyyaml>=6.0",
    "aiofiles>=23.0",
    "websockets>=12.0",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "pydub>=0.25.1",
    "psutil>=5.9.0",
    "platformdirs>=4.0.0",
    "requests>=2.31.0",
    "colorama>=0.4.6",
    "httpx>=0.27.0",
    "click>=8.0.0",
    "rich>=13.0.0",
    "textual>=0.52.0",
]
[project.optional-dependencies]
webrtc = ["aiortc>=1.14.0"]
tts = ["edge-tts>=6.1.0"]
processing = [
    "faster-whisper>=1.0.0",
    "argostranslate>=1.9.0",
    "piper-tts>=1.2.0",
]
gpu = [
    "nvidia-ml-py>=12.0.0",
    "onnxruntime-gpu>=1.19.0",
]
gpu-mac = [
    "onnxruntime-silicon>=1.19.0",
]
cli = [
    "textual>=0.52.0",
    "httpx>=0.27.0",
    "click>=8.0.0",
    "rich>=13.0.0",
    "colorama>=0.4.6",
]
# dev y docs ahora forman parte de dependencies o se instalan via requirements.txt
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "anyio>=4.0.0",
    "pytest-xdist>=3.5.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "pre-commit>=4.5.0",
]
docs = [
    "mkdocs>=1.6.0",
]
[project.scripts]
srt2web = "main:main"
srt2web-tui = "cli.main:cli_entry"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["core*", "modules*", "server*", "scripts*", "cli*"]
exclude = ["tests*", "venv*"]
namespaces = false

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["core", "modules", "server", "scripts", "tests", "cli"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "F841", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["core", "modules", "server"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = false
exclude = ["desktop", "scripts", "desktop/dist", "venv", "tests", "server/static"]
warn_unused_ignores = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "core.*"
strict = true
ignore_errors = false

[[tool.mypy.overrides]]
module = "server.*"
strict = true
ignore_errors = false

[[tool.mypy.overrides]]
module = "modules.*"
strict = true
ignore_errors = false
follow_imports = "normal"

[[tool.mypy.overrides]]
module = "cli.*"
strict = true
ignore_errors = false

# Third-party libs without stubs
[[tool.mypy.overrides]]
module = [
    "onnxruntime",
    "argostranslate", "argostranslate.package", "argostranslate.translate",
    "textual", "textual.widgets", "textual.screen", "textual.app",
    "aiortc", "av",
    "faster_whisper",
    "edge_tts",
    "yaml",
    "prometheus_client",
    "pynvml",
    "piper", "piper.config",
    "torch",
    "jwt",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = [
    "unit: Unit tests - fast, isolated, no external dependencies",
    "integration: Integration tests - test component interactions",
    "e2e: End-to-end tests - test full pipeline",
    "performance: Performance benchmarks and latency tests",
    "security: Security-related tests",
    "slow: Tests that take more than 5 seconds",
    "gpu: Tests that require GPU",
    "cpu: Tests that run on CPU only",
]
