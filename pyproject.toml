[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "srt2web"
version = "0.6.8"
description = "Real-time SRT streaming processor with Web dashboard"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = {text = "MIT"}
authors = [
    {name = "BrunoJimenez73"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
core = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pyyaml>=6.0",
    "aiofiles>=23.0",
    "websockets>=12.0",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "pydub>=0.25.1",
    "psutil>=5.9.0",
    "platformdirs>=4.0.0",
    # nvidia-ml-py solo funciona en Windows/Linux con NVIDIA GPU.
    # En macOS (Apple Silicon) se instala sin ella (ver install_Mac.sh).
    "nvidia-ml-py>=12.0.0",
]
processing = [
    "faster-whisper>=1.0.0",
    "argostranslate>=1.9.0",
    "piper-tts>=1.2.0",
]
gpu = [
    "onnxruntime-gpu>=1.19.0",
    "nvidia-cublas-cu11>=8.9.4.25",
    "nvidia-cudnn-cu11>=8.9.4.25",
]
# macOS: usa onnxruntime-silicon en vez de onnxruntime-gpu
# Instalar con: pip install onnxruntime-silicon
# Ver install_Mac.sh para instalación automática
webrtc = [
    "aiortc>=1.14.0",
]
tts = [
    "edge-tts>=6.1.0",
]
cli = [
    "textual>=0.52.0",
    "httpx>=0.27.0",
    "click>=8.0.0",
    "rich>=13.0.0",
    "colorama>=0.4.6",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "anyio>=4.0.0",
    "pytest-xdist>=3.5.0",
    "ruff>=0.1.6",
    "mypy>=1.8.0",
    "pre-commit>=4.5.0",
]

[project.scripts]
srt2web = "main:main"
srt2web-tui = "cli.main:cli_entry"

[tool.setuptools]
packages = ["core", "modules", "server", "scripts", "cli", "cli.client", "cli.tui", "cli.tui.screens", "cli.tui.widgets", "cli.commands"]
include-package-data = true

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["core", "modules", "server", "scripts", "tests", "cli"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "F841", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["core", "modules", "server"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = false
exclude = ["desktop", "scripts", "desktop/dist", "venv", "tests"]
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "core.*"
strict = true
ignore_errors = false

[[tool.mypy.overrides]]
module = "server.*"
strict = true
ignore_errors = false

[[tool.mypy.overrides]]
module = "modules.*"
strict = true
ignore_errors = false
follow_imports = "normal"

[[tool.mypy.overrides]]
module = "cli.*"
strict = true
ignore_errors = false

[[tool.mypy.overrides]]
module = [
    "onnxruntime",
    "onnxruntime.*",
    "argostranslate",
    "argostranslate.*",
    "argostranslate.package",
    "argostranslate.translate",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.pytest.ini_options]
markers = [
    "unit: Unit tests - fast, isolated, no external dependencies",
    "integration: Integration tests - test component interactions",
    "e2e: End-to-end tests - test full pipeline",
    "performance: Performance benchmarks and latency tests",
    "security: Security-related tests",
    "slow: Tests that take more than 5 seconds",
    "gpu: Tests that require GPU",
    "cpu: Tests that run on CPU only",
]
