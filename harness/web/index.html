<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>srt2web Harness</title>
    <style>
      :root {
        --bg: #0d1117;
        --bg-card: #161b22;
        --bg-input: #0d1117;
        --border: #30363d;
        --text: #c9d1d9;
        --text-dim: #8b949e;
        --accent: #58a6ff;
        --green: #3fb950;
        --yellow: #d29922;
        --red: #f85149;
        --orange: #db6d28;
        --purple: #bc8cff;
        --radius: 6px;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica,
          Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.5;
      }
      .header {
        background: var(--bg-card);
        border-bottom: 1px solid var(--border);
        padding: 12px 24px;
        display: flex;
        align-items: center;
        gap: 16px;
        position: sticky;
        top: 0;
        z-index: 100;
      }
      .header h1 {
        font-size: 18px;
        font-weight: 600;
        color: var(--accent);
      }
      .header .stats {
        display: flex;
        gap: 12px;
        margin-left: auto;
        font-size: 13px;
      }
      .header .stat {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .header .stat .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
      }
      .dot-done {
        background: var(--green);
      }
      .dot-pending {
        background: var(--yellow);
      }
      .dot-progress {
        background: var(--accent);
      }
      .dot-blocked {
        background: var(--red);
      }

      .toolbar {
        padding: 12px 24px;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        border-bottom: 1px solid var(--border);
      }
      .toolbar select,
      .toolbar input,
      .toolbar button {
        background: var(--bg-card);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 6px 12px;
        border-radius: var(--radius);
        font-size: 13px;
      }
      .toolbar select:focus,
      .toolbar input:focus {
        outline: none;
        border-color: var(--accent);
      }
      .toolbar button {
        cursor: pointer;
        font-weight: 500;
      }
      .toolbar button:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      .toolbar button.primary {
        background: var(--accent);
        color: var(--bg);
        border-color: var(--accent);
      }
      .toolbar button.primary:hover {
        opacity: 0.9;
      }

      .container {
        display: flex;
        height: calc(100vh - 94px);
      }
      .sidebar {
        width: 320px;
        border-right: 1px solid var(--border);
        overflow-y: auto;
        flex-shrink: 0;
      }
      .main {
        flex: 1;
        overflow-y: auto;
        padding: 24px;
      }

      .feature-list {
        list-style: none;
      }
      .feature-item {
        padding: 10px 16px;
        border-bottom: 1px solid var(--border);
        cursor: pointer;
        transition: background 0.1s;
      }
      .feature-item:hover {
        background: var(--bg-card);
      }
      .feature-item.active {
        background: var(--bg-card);
        border-left: 3px solid var(--accent);
      }
      .feature-item .fid {
        font-weight: 600;
        font-size: 13px;
        color: var(--accent);
        margin-right: 8px;
      }
      .feature-item .ftitle {
        font-size: 13px;
        color: var(--text);
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .feature-item .fmeta {
        font-size: 11px;
        color: var(--text-dim);
        margin-top: 2px;
        display: flex;
        gap: 8px;
      }
      .status-badge {
        display: inline-block;
        padding: 1px 6px;
        border-radius: 10px;
        font-size: 11px;
        font-weight: 500;
      }
      .status-done {
        background: rgba(63, 185, 80, 0.15);
        color: var(--green);
      }
      .status-pending {
        background: rgba(210, 153, 34, 0.15);
        color: var(--yellow);
      }
      .status-in_progress {
        background: rgba(88, 166, 255, 0.15);
        color: var(--accent);
      }
      .status-blocked {
        background: rgba(248, 81, 73, 0.15);
        color: var(--red);
      }

      .detail-view {
        max-width: 800px;
      }
      .detail-view h2 {
        font-size: 20px;
        margin-bottom: 16px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .detail-view .field-group {
        margin-bottom: 16px;
      }
      .detail-view label {
        display: block;
        font-size: 12px;
        font-weight: 500;
        color: var(--text-dim);
        margin-bottom: 4px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .detail-view .field-value {
        font-size: 14px;
        line-height: 1.6;
      }
      .detail-view .field-value.muted {
        color: var(--text-dim);
      }

      .detail-view textarea,
      .detail-view input,
      .detail-view select {
        width: 100%;
        background: var(--bg-input);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 8px 12px;
        border-radius: var(--radius);
        font-size: 14px;
        font-family: inherit;
      }
      .detail-view textarea:focus,
      .detail-view input:focus,
      .detail-view select:focus {
        outline: none;
        border-color: var(--accent);
      }
      .detail-view textarea {
        min-height: 100px;
        resize: vertical;
      }

      .btn-row {
        display: flex;
        gap: 8px;
        margin-top: 20px;
        padding-top: 16px;
        border-top: 1px solid var(--border);
      }
      .btn {
        padding: 6px 16px;
        border-radius: var(--radius);
        border: 1px solid var(--border);
        background: var(--bg-card);
        color: var(--text);
        cursor: pointer;
        font-size: 13px;
        font-weight: 500;
      }
      .btn:hover {
        border-color: var(--accent);
      }
      .btn.danger {
        border-color: var(--red);
        color: var(--red);
      }
      .btn.danger:hover {
        background: rgba(248, 81, 73, 0.1);
      }

      .audit-list {
        margin-top: 24px;
        border-top: 1px solid var(--border);
        padding-top: 16px;
      }
      .audit-list h3 {
        font-size: 14px;
        margin-bottom: 8px;
        color: var(--text-dim);
      }
      .audit-entry {
        font-size: 12px;
        padding: 4px 0;
        color: var(--text-dim);
        border-bottom: 1px solid var(--border);
      }
      .audit-entry .ts {
        color: var(--text-dim);
      }
      .audit-entry .field {
        color: var(--accent);
      }
      .audit-entry .val {
        color: var(--text);
      }

      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.6);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 200;
      }
      .modal {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 24px;
        width: 480px;
        max-width: 90vw;
      }
      .modal h3 {
        margin-bottom: 16px;
      }
      .modal .field-group {
        margin-bottom: 12px;
      }
      .modal label {
        display: block;
        font-size: 12px;
        color: var(--text-dim);
        margin-bottom: 4px;
      }
      .modal input,
      .modal select,
      .modal textarea {
        width: 100%;
        background: var(--bg-input);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 6px 10px;
        border-radius: var(--radius);
        font-size: 13px;
      }
      .modal .btn-row {
        justify-content: flex-end;
      }

      .empty-state {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        color: var(--text-dim);
        font-size: 14px;
      }
      .empty-state .icon {
        font-size: 48px;
        margin-bottom: 12px;
      }

      .loading {
        color: var(--text-dim);
        font-style: italic;
      }

      #errorBar {
        display: none;
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: var(--red);
        color: #fff;
        padding: 8px 16px;
        font-size: 13px;
        z-index: 999;
        text-align: center;
      }

      .tabs {
        display: flex;
        gap: 0;
        border-bottom: 1px solid var(--border);
        padding: 0 24px;
        background: var(--bg-card);
      }
      .tab {
        padding: 10px 20px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 500;
        color: var(--text-dim);
        border-bottom: 2px solid transparent;
        transition: all 0.15s;
      }
      .tab:hover {
        color: var(--text);
      }
      .tab.active {
        color: var(--accent);
        border-bottom-color: var(--accent);
      }

      .progress-list {
        list-style: none;
      }
      .progress-item {
        padding: 12px 16px;
        border-bottom: 1px solid var(--border);
        cursor: pointer;
        transition: background 0.1s;
      }
      .progress-item:hover {
        background: var(--bg-card);
      }
      .progress-item.active {
        background: var(--bg-card);
        border-left: 3px solid var(--accent);
      }
      .progress-item .pdate {
        font-weight: 600;
        font-size: 12px;
        color: var(--accent);
        margin-right: 8px;
      }
      .progress-item .ptitle {
        font-size: 13px;
        color: var(--text);
      }
      .progress-item .pmeta {
        font-size: 11px;
        color: var(--text-dim);
        margin-top: 4px;
        display: flex;
        gap: 8px;
      }
      .progress-item .current-badge {
        background: rgba(63, 185, 80, 0.15);
        color: var(--green);
        padding: 1px 6px;
        border-radius: 10px;
        font-size: 10px;
        font-weight: 600;
      }

      .progress-detail {
        max-width: 800px;
      }
      .progress-detail h2 {
        font-size: 18px;
        margin-bottom: 12px;
      }
      .progress-detail .content-md {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 16px;
        font-size: 13px;
        line-height: 1.6;
        white-space: pre-wrap;
        max-height: 500px;
        overflow-y: auto;
      }
      .progress-detail .meta-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-bottom: 16px;
      }
      .progress-detail .meta-box {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 12px;
      }
      .progress-detail .meta-box h4 {
        font-size: 11px;
        text-transform: uppercase;
        color: var(--text-dim);
        margin-bottom: 6px;
      }
      .progress-detail .tag {
        display: inline-block;
        background: rgba(88, 166, 255, 0.1);
        color: var(--accent);
        padding: 2px 8px;
        border-radius: 4px;
        font-size: 11px;
        margin: 2px;
      }
      .progress-detail .verify-item {
        font-size: 12px;
        padding: 2px 0;
        color: var(--green);
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h1>srt2web Harness</h1>
      <div class="stats" id="headerStats"></div>
    </div>

    <div class="toolbar">
      <select id="filterStatus">
        <option value="">All statuses</option>
        <option value="pending">Pending</option>
        <option value="in_progress">In Progress</option>
        <option value="done">Done</option>
        <option value="blocked">Blocked</option>
      </select>
      <select id="filterArea">
        <option value="">All areas</option>
      </select>
      <input type="text" id="searchBox" placeholder="Search features..." />
      <button class="primary" onclick="showNewModal()">+ New Feature</button>
      <button onclick="doExport()">Export JSON</button>
      <button onclick="doMigrate()">Re-migrate JSON</button>
      <button onclick="doImportProgress()">Import Progress MD</button>
    </div>

    <div class="tabs">
      <div
        class="tab active"
        onclick="window.switchTab('features')"
        id="tab-features"
      >
        Features
      </div>
      <div class="tab" onclick="window.switchTab('progress')" id="tab-progress">
        Progress
      </div>
    </div>

    <div class="container" id="featuresView">
      <div class="sidebar">
        <ul class="feature-list" id="featureList"></ul>
      </div>
      <div class="main" id="mainPanel">
        <div class="empty-state">
          <div class="icon">&#128203;</div>
          <div>Select a feature from the list</div>
        </div>
      </div>
    </div>

    <div class="container" id="progressView" style="display: none">
      <div class="sidebar">
        <ul class="progress-list" id="progressList"></ul>
      </div>
      <div class="main" id="progressPanel">
        <div class="empty-state">
          <div class="icon">&#128197;</div>
          <div>Select a session from the list</div>
        </div>
      </div>
    </div>

    <div id="modalContainer"></div>
    <div id="errorBar"></div>

    <script type="module" src="api.js"></script>
    <script type="module" src="features.js"></script>
    <script type="module" src="progress.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
