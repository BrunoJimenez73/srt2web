services:
  app:
    build:
      context: .
      # Para GPU CUDA: docker compose build --build-arg BASE_IMAGE=nvidia/cuda:12.2.0-runtime-ubuntu22.04
      args:
        BASE_IMAGE: python:3.12-slim
    ports:
      - "9999:9999" # HTTP API, Web UI, HLS
      - "9000:9000/udp" # SRT input
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
      - ./output:/app/output
    env_file:
      - .env
    environment:
      SERVER_HOST: 0.0.0.0
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; exit(0 if urllib.request.urlopen('http://localhost:9999/health').status == 200 else 1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
