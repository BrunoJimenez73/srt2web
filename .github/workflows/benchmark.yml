name: Benchmark Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run nightly at 2 AM UTC
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      runs:
        description: "Number of benchmark runs per test"
        required: true
        default: "10"
        type: string

jobs:
  benchmark:
    name: Benchmark Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      checks: write

    env:
      PYTHON_VERSION: "3.12"
      BENCHMARK_RUNS: ${{ github.event.inputs.runs || '10' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "ruff==0.15.14" "mypy==2.1.0" "types-psutil" pytest pytest-asyncio pytest-cov pytest-benchmark pydantic
          pip install -r config/requirements.txt
          pip install -e .[dev]

      - name: Lint with Ruff
        run: |
          ruff check core/ modules/ server/ tests/
          ruff format --check core/ modules/ server/ tests/

      - name: Run benchmarks
        run: |
          python -m pytest tests/integration/ -v \
            -m "integration" \
            --benchmark-only \
            --benchmark-runs=${{ env.BENCHMARK_RUNS }} \
            --benchmark-min-rounds=5 \
            --benchmark-warmup=true \
            --benchmark-warmup-iterations=3 \
            --benchmark-timer=time.perf_counter \
            --benchmark-json=benchmark-results.json \
            --benchmark-columns=min,max,mean,stddev,median,iqr,outliers,ops,rounds,iterations

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results.json
          retention-days: 30

      - name: Comment PR with benchmark results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const results = JSON.parse(fs.readFileSync('benchmark-results.json', 'utf8'));
            
            let markdown = '## 📊 Benchmark Results\n\n';
            markdown += '| Test | Min (ms) | Max (ms) | Mean (ms) | StdDev (ms) | Median (ms) | Ops/sec |\n';
            markdown += '|------|----------|----------|-----------|-------------|-------------|---------|\n';
            
            for (const [name, data] of Object.entries(results.benchmarks)) {
              const stats = data.stats;
              markdown += `| ${name} | ${stats.min.toFixed(2)} | ${stats.max.toFixed(2)} | ${stats.mean.toFixed(2)} | ${stats.stddev.toFixed(2)} | ${stats.median.toFixed(2)} | ${(1/stats.mean*1000).toFixed(2)} |\n`;
            }
            
            markdown += '\n*Runs: ${{ env.BENCHMARK_RUNS }} | Timer: time.perf_counter*';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: markdown
            });

      - name: Compare with baseline (main branch)
        if: github.event_name == 'pull_request'
        run: |
          python -m pytest tests/integration/ -v \
            --benchmark-compare \
            --benchmark-compare-fail=min:5% \
            --benchmark-json=benchmark-results.json

  # Run benchmarks on multiple OSes for cross-platform comparison
  cross-platform-benchmark:
    name: Cross-Platform Benchmarks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-benchmark pytest-asyncio
          pip install -e .[dev]

      - name: Run cross-platform benchmarks
        run: |
          python -m pytest tests/integration/ -v \
            -m "integration and not slow" \
            --benchmark-only \
            --benchmark-runs=5 \
            --benchmark-json=benchmark-${{ matrix.os }}.json

      - name: Upload cross-platform results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ matrix.os }}
          path: benchmark-${{ matrix.os }}.json
          retention-days: 7