name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Nightly run for integration tests with benchmark
    - cron: "0 2 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

permissions:
  contents: read
  packages: write

jobs:
  backend-tests:
    name: Unit Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "ruff==0.15.14" "mypy==2.1.0" "types-psutil" pytest pytest-asyncio pytest-cov pydantic pytest-mock pytest-benchmark pytest-xdist
          pip install -r config/requirements.txt
          # Explicitly install PyJWT to ensure jwt module is available
          pip install "PyJWT>=2.8.0"

      - name: Lint with Ruff
        run: |
          ruff check core/ modules/ server/ tests/
          ruff format --check core/ modules/ server/ tests/

      - name: Type check with MyPy
        run: |
          mypy core/ modules/ server/ cli/ --strict --config-file pyproject.toml
        continue-on-error: false

      - name: Run unit tests (skip integration/slow)
        run: |
          python -m pytest tests/unit/ -v --cov=core --cov=modules --cov=server --cov-report=xml -m "not integration" -n auto --basetemp=.pytest-ci-temp
        timeout-minutes: 30

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: backend-${{ matrix.os }}

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-cov pytest-benchmark pytest-mock
          pip install -r config/requirements.txt
          pip install -e .[dev]

      - name: Run integration tests
        run: |
          python -m pytest tests/integration/ -v \
            -m "integration" \
            --cov=core --cov=modules --cov=server \
            --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: integration

      - name: Run benchmarks (nightly only)
        if: github.event_name == 'schedule'
        run: |
          python -m pytest tests/integration/ -v \
            -m "integration" \
            --benchmark-only \
            --benchmark-min-rounds=10 \
            --benchmark-warmup=true \
            --benchmark-warmup-iterations=3 \
            --benchmark-timer=time.perf_counter \
            --benchmark-json=benchmark-results.json

      - name: Upload benchmark results
        if: github.event_name == 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results.json
          retention-days: 30

      - name: Compare with baseline
        if: github.event_name == 'schedule'
        run: |
          python -m pytest tests/integration/ -v \
            --benchmark-compare \
            --benchmark-compare-fail=min:5% \
            --benchmark-json=benchmark-results.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Run frontend tests
        run: npm test

      - name: Lint frontend
        run: npm run lint

  docker:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set lowercase repository
        id: lower-repo
        run: echo "repo=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build image (validation)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: srt2web:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Login to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (multi-platform)
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ steps.lower-repo.outputs.repo }}/srt2web:latest
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
