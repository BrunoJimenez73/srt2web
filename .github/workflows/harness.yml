name: Harness CI

on:
  push:
    branches: [main, develop]
    paths:
      - "harness/**"
      - "tests/unit/test_harness.py"
  pull_request:
    branches: [main]
    paths:
      - "harness/**"
      - "tests/unit/test_harness.py"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  harness-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest
          pip install -r config/requirements.txt 2>/dev/null || true

      - name: Lint with Ruff
        run: ruff check harness/ --output-format=github || true

      - name: Type check with mypy
        run: mypy harness/ --ignore-missing-imports || true

      - name: Run harness tests
        run: python -m pytest tests/unit/test_harness.py -v --tb=short

      - name: Verify CLI works
        run: |
          python -m harness health
          python -m harness stats
