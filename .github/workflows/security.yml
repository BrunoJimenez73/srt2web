name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # Weekly Monday 06:00 UTC

jobs:
  bandit:
    name: Python Security (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bandit
        run: pip install bandit[toml]

      - name: Run bandit
        run: |
          bandit -r core/ modules/ server/ -f json -o bandit-report.json --severity-level medium || true
          bandit -r core/ modules/ server/ -f screen --severity-level high

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit Python dependencies
        # PYSEC-2026-3075 (stanza) se ignora: argostranslate pinnea stanza==1.10.1
        # exacto; no hay versión segura compatible sin romper la resolución.
        run: pip-audit -r config/requirements.txt --ignore-vuln PYSEC-2026-3075

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Audit frontend dependencies
        # Los 2 high restantes son de astro<=6 (XSS dev-server/build-time) + sharp/esbuild
        # transitivos; el fix requiere astro 7 (breaking, PR dependabot #9 pendiente).
        # En runtime estático servido por FastAPI no aplican.
        working-directory: frontend
        run: npm audit --audit-level=critical
