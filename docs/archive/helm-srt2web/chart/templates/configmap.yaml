apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "srt2web.fullname" . }}
  labels:
    {{- include "srt2web.labels" . | nindent 4 }}
data:
  config.yaml: |
    server:
      host: {{ .Values.config.server.host }}
      port: {{ .Values.config.server.port }}
      cors_origins:
        {{- range .Values.config.server.cors_origins }}
        - {{ . | quote }}
        {{- end }}
      auth_token: ""
      rate_limit_rpm: {{ .Values.config.server.rate_limit_rpm }}
      max_request_size_mb: {{ .Values.config.server.max_request_size_mb }}
    pipeline:
      chunk_duration_sec: {{ .Values.config.pipeline.chunk_duration_sec }}
      mode: {{ .Values.config.pipeline.mode }}
      max_concurrent_chunks: {{ .Values.config.pipeline.max_concurrent_chunks }}
  users.json: |
    {}
