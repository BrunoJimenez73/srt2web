# Default values for srt2web Helm chart.
# This is a YAML-formatted file.

replicaCount: 1

image:
  repository: ghcr.io/brunojimenez73/srt2web
  tag: latest
  pullPolicy: Always

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 9999
  targetPort: 9999
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: srt2web.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: srt2web-tls
      hosts:
        - srt2web.example.com

resources:
  limits:
    cpu: 4000m
    memory: 8Gi
  requests:
    cpu: 1000m
    memory: 2Gi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

persistence:
  enabled: true
  size: 50Gi
  storageClass: ""
  accessMode: ReadWriteOnce
  annotations: {}

# SRT input port (UDP)
srt:
  enabled: true
  port: 9000
  nodePort: 30900

# Configuration
config:
  server:
    host: 0.0.0.0
    port: 9999
    cors_origins:
      - "http://localhost:*"
      - "http://127.0.0.1:*"
    auth_token: ""
    rate_limit_rpm: 600
    max_request_size_mb: 100
  pipeline:
    chunk_duration_sec: 6
    mode: thread_parallel
    max_concurrent_chunks: 4

secrets:
  auth_token: ""
  jwt_secret: ""

nodeSelector: {}
tolerations: []
affinity: {}

# Health check
livenessProbe:
  path: /live
  initialDelaySeconds: 30
  periodSeconds: 15

readinessProbe:
  path: /ready
  initialDelaySeconds: 15
  periodSeconds: 10

startupProbe:
  path: /live
  initialDelaySeconds: 5
  periodSeconds: 5
  failureThreshold: 30
