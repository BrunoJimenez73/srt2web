server:
  host: 127.0.0.1
  port: 9999
  cors_origins:
    - http://localhost:*
    - http://127.0.0.1:*
  auth_token: ''
  rate_limit_rpm: 60
  max_request_size_mb: 1

input:
  type: srt
  srt:
    listen_port: 9000
    mode: listener
    latency_ms: 1000
    caller_address: ''
    chunk_duration_sec: 10
  file:
    path: ./video.mp4
    loop: false
    speed: 1
  rtmp:
    url: rtmp://localhost/live/stream
    mode: pull
  chunk_duration_sec: 10

output:
  type: web
  web:
    segment_duration: 15
    list_size: 6
    audio_offset_ms: 0
    video_preset: medium
    video_crf: 18
    video_profile: high
    video_tune: zerolatency
    encoder_mode: auto
    gpu_preset: p3
    audio_codec: aac
    audio_bitrate: 192k
    audio_sample_rate: 48000
    subtitle_language: es
    subtitle_language_name: Spanish
  rtmp:
    url: rtmp://localhost/live/output
    video_bitrate: 2500k
    audio_bitrate: 128k
    video_codec: libx264
    preset: medium
    audio_codec: aac
  srt:
    host: localhost
    port: 9001
    latency_ms: 1000

pipeline:
  chunk_duration_sec: 6

modules:
  audio_extractor:
    enabled: true
  transcriber:
    enabled: true
    model: small
    language: es
    device: auto
  translator:
    enabled: true
    source_lang: es
    target_lang: en
  subtitle_generator:
    enabled: true
    format: webvtt
    use_translated: true
    audio_offset_ms: 0
    font_size: 24
    max_vtt_entries: 50
    vtt_max_age_seconds: 60
  tts_engine:
    enabled: false
    engine: piper
    device: cpu
    voice: es_ES-davefx-medium
    speed: 1.0
  audio_mixer:
    enabled: false
    original_volume: 0.7
    dubbed_volume: 1.4
    tts_volume: 1.1
  video_muxer:
    enabled: true
    hls_segment_duration: 10
    audio_offset_ms: 0
    hls_list_size: 4
    video_preset: medium
    gpu_preset: p3
    encoder_mode: auto
    video_quality: medium
    video_crf: 18
    audio_codec: aac
    audio_bitrate: 192k
    audio_samplerate: '48000'

output_dir:
  directory: ./output

srt:
  listen_port: 8888
