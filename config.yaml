server:
  host: 127.0.0.1
  port: 9999
  cors_origins:
  - http://localhost:*
  - http://127.0.0.1:*
  auth_token: ''
  rate_limit_rpm: 600
  max_request_size_mb: 100
input:
  type: srt
  srt:
    listen_port: 9000
    mode: listener
    latency_ms: 200
    caller_address: ''
  rtmp:
    listen_port: 1935
    app: live
    stream_key: stream
    url: ''
    mode: listener
    chunk_duration_sec: 15
  file:
    path: ''
    loop: false
    speed: 1.0
    chunk_duration_sec: 15
output:
  type: web
  web:
    segment_duration: 4
    list_size: 6
    audio_offset_ms: 0
    encoder_mode: gpu_nvenc
  hls:
    segment_duration: 4
    list_size: 6
    audio_offset_ms: 0
    encoder_mode: gpu_nvenc
  rtmp:
    url: rtmp://localhost/live/stream
    video_bitrate: 2500k
    audio_bitrate: 128k
    video_codec: h264
    preset: medium
    audio_codec: aac
    encoder_mode: auto
  srt:
    url: srt://localhost:9001
    mode: caller
    latency_ms: 200
    stream_id: ''
    passphrase: ''
    video_bitrate: 2500k
    audio_bitrate: 128k
    video_codec: h264
    preset: medium
    audio_codec: aac
  file:
    save_video: true
    save_audio: true
    save_subtitles: true
    path: ./output
pipeline:
  chunk_duration_sec: 15
  mode: thread_parallel
  max_concurrent_chunks: 3
  buffer_size: 5
  retry_attempts: 2
  retry_delay: 1.0
modules:
  audio_extractor:
    enabled: true
  transcriber:
    enabled: true
    model: tiny
    language: en
    device: cuda
    beam_size: 2
  translator:
    enabled: true
    source_lang: en
    target_lang: es
  subtitle_generator:
    enabled: true
    format: webvtt
    use_translated: true
    chunk_duration: 15
  tts_engine:
    enabled: true
    engine: piper
    device: cuda
    voice: es_MX-claude-high
    speed: 1.0
  audio_mixer:
    enabled: true
    original_volume: 0.7
    tts_volume: 1.0
    dubbed_volume: 1.0
  video_muxer:
    enabled: true
    engine: webrtc
    hls_segment_duration: 10
    hls_list_size: 6
    audio_offset_ms: 0
    encoder_mode: gpu_nvenc
    video_quality: medium
    video_crf: 23
    audio_codec: opus
    audio_bitrate: 128k
    audio_samplerate: '48000'
    video_bitrate: 1000k
    video_fps: 30
    video_width: 1920
    video_height: 1080
    webrtc_audio_codec: null
    webrtc_audio_bitrate: null
    audio_sample_rate: 24000
    gpu_preset: p7
    video_preset: medium
output_dir:
  directory: ./output
</write_to_file>
<task_progress>
- [x] Check encoder configuration in video_muxer.py
- [x] Verify FFmpeg path and NVENC support
- [x] Test NVENC encoding with FFmpeg command
- [x] Check hardware_monitor for GPU detection
- [x] Review logs for encoding errors
- [x] Modify config.yaml to force GPU detection
- [x] Rebuild frontend after config change
- [ ] Verify GPU metrics in video_muxer status
</task_progress>
</write_to_file>