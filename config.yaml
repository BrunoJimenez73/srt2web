server:
  host: 127.0.0.1
  port: 8080
  cors_origins:
  - http://localhost:*
  - http://127.0.0.1:*
  auth_token: ''
  rate_limit_rpm: 60
  max_request_size_mb: 100
input:
  type: srt
  srt:
    listen_port: 9000
    mode: listener
    latency_ms: 200
    caller_address: ''
  file:
    path: ''
    loop: false
    speed: 1
    chunk_duration_sec: 10
  rtmp:
    listen_port: 1935
    app: live
    stream_key: stream
    url: ''
    port: 1935
    chunk_duration_sec: 10
output:
  type: web
  web:
    segment_duration: 4
    list_size: 6
    audio_offset_ms: 0
    encoder_mode: auto
  hls:
    segment_duration: 10
    list_size: 2
    audio_offset_ms: 0
  rtmp:
    url: rtmp://localhost/live/stream
    video_bitrate: 2500k
    audio_bitrate: 128k
    video_codec: libx264
    preset: medium
    audio_codec: aac
    encoder_mode: auto
  srt:
    url: srt://localhost:9001
    mode: caller
    latency_ms: 200
    stream_id: ''
    passphrase: ''
    video_bitrate: 2500k
    audio_bitrate: 128k
    video_codec: libx264
    preset: medium
    audio_codec: aac
  file:
    save_video: true
    save_audio: true
    save_subtitles: true
    path: ./output
pipeline:
  chunk_duration_sec: 10
modules:
  audio_extractor:
    enabled: true
  transcriber:
    enabled: true
    model: tiny
    language: en
    device: auto
  translator:
    enabled: true
    source_lang: en
    target_lang: es
  subtitle_generator:
    enabled: true
    format: webvtt
    use_translated: true
    chunk_duration: 10
  tts_engine:
    enabled: true
    engine: piper
    device: cuda
    voice: es_AR-daniela-high
    speed: 1
  audio_mixer:
    enabled: true
    original_volume: 0.5
    tts_volume: 1
  video_muxer:
    enabled: true
    hls_segment_duration: 10
    audio_offset_ms: 0
    encoder_mode: gpu_nvenc
    hls_list_size: 6
    video_quality: medium
    video_crf: 26
    audio_codec: aac
    audio_bitrate: 64k
    audio_samplerate: '48000'
    engine: webrtc
    video_bitrate: 1000k
    video_fps: 30
    audio_sample_rate: 24000
    video_codec: vp8
    video_width: 1920
    video_height: 1080
    webrtc_audio_codec: opus
    webrtc_audio_bitrate: 32k
output_dir:
  directory: ./output
