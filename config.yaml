server:
  host: 127.0.0.1
  port: 9999
  cors_origins:
  - http://localhost:*
  - http://127.0.0.1:*
  auth_token: ''
  rate_limit_rpm: 600
  max_request_size_mb: 100
input:
  type: srt
  srt:
    listen_port: 9000
    mode: listener
    latency_ms: 200
    caller_address: ''
    chunk_duration_sec: 15
  rtmp:
    listen_port: 1935
    app: live
    stream_key: stream
    url: ''
    mode: listener
    chunk_duration_sec: 15
  file:
    path: ''
    loop: false
    speed: 1.0
    chunk_duration_sec: 15
output:
  type: web
  web:
    segment_duration: 4
    list_size: 6
    audio_offset_ms: 0
    encoder_mode: auto
  hls:
    segment_duration: 4
    list_size: 6
    audio_offset_ms: 0
    encoder_mode: auto
  rtmp:
    url: rtmp://localhost/live/stream
    video_bitrate: 2500k
    audio_bitrate: 128k
    video_codec: h264
    preset: medium
    audio_codec: aac
    encoder_mode: auto
  srt:
    url: srt://localhost:9001
    mode: caller
    latency_ms: 200
    stream_id: ''
    passphrase: ''
    video_bitrate: 2500k
    audio_bitrate: 128k
    video_codec: h264
    preset: medium
    audio_codec: aac
  file:
    path: ./output
    save_video: true
    save_audio: true
    save_subtitles: true
  recording:
    output_path: ./output/recording.mp4
    format: mp4
    codec: copy
    video_bitrate: 5000k
    video_crf: 23
    quality_mode: cbr
    audio_codec: copy
    audio_bitrate: 128k
    split_mode: none
    split_value: 600
    subtitles: burnt
    video_preset: fast
  outputs:
  - name: web_1
    type: web
    enabled: true
    config:
      segment_duration: 4
      list_size: 6
      audio_offset_ms: 0
      encoder_mode: auto
  - name: recording_1777056636276
    type: recording
    enabled: true
    config:
      type: recording
      name: recording_1777056636276
      output_path: ./output/grabacion.mp4
      format: mp4
      codec: copy
      audio_codec: aac
pipeline:
  chunk_duration_sec: 15
  mode: thread_parallel
  max_concurrent_chunks: 3
  buffer_size: 5
  retry_attempts: 2
  retry_delay: 1.0
modules:
  audio_extractor:
    enabled: true
  transcriber:
    enabled: true
    model: tiny
    language: auto
    device: auto
    beam_size: 2
  translator:
    enabled: true
    source_lang: en
    target_lang: es
  subtitle_generator:
    enabled: true
    format: srt
    use_translated: true
    chunk_duration: 15
  tts_engine:
    enabled: true
    engine: piper
    device: cuda
    voice: es_AR-daniela-high
    speed: 1.0
  audio_mixer:
    enabled: true
    original_volume: 0.7
    tts_volume: 1.0
    dubbed_volume: 1.0
  video_muxer:
    enabled: true
    engine: hls
    hls_segment_duration: 10
    hls_list_size: 6
    audio_offset_ms: 0
    encoder_mode: auto
    video_quality: medium
    video_crf: 41
    audio_codec: aac
    audio_bitrate: 128k
    audio_samplerate: '48000'
    video_bitrate: 1000k
    video_fps: 15
    video_width: 320
    video_height: 240
    webrtc_audio_codec: null
    webrtc_audio_bitrate: null
    audio_sample_rate: 24000
    gpu_preset: p7
    video_preset: medium
output_dir:
  directory: ./output
