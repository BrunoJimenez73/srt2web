server:
  host: 127.0.0.1
  port: 8080
  cors_origins:
  - http://localhost:*
  - http://127.0.0.1:*
  auth_token: ''
  rate_limit_rpm: 60
  max_request_size_mb: 100
input:
  type: srt
  srt:
    listen_port: 9000
    mode: listener
    latency_ms: 200
    caller_address: ''
  file:
    path: ''
    loop: false
    speed: 1.0
output:
  type: web
  web:
    segment_duration: 4
    list_size: 3
    audio_offset_ms: 0
pipeline:
  chunk_duration_sec: 6
modules:
  audio_extractor:
    enabled: true
  transcriber:
    enabled: true
    model: tiny
    language: en
    device: auto
    beam_size: 2
  translator:
    enabled: true
    source_lang: en
    target_lang: es
  subtitle_generator:
    enabled: true
    format: webvtt
    use_translated: true
  tts_engine:
    enabled: true
    engine: piper
    device: cuda
    voice: es_AR-daniela-high
    speed: 1
  audio_mixer:
    enabled: true
    original_volume: 0.7
    dubbed_volume: 1.0
    tts_volume: 1
  video_muxer:
    enabled: true
    hls_segment_duration: 4
    audio_offset_ms: 0
    encoder_mode: gpu_nvenc
    hls_list_size: 6
    video_quality: medium
    video_crf: 26
    audio_codec: aac
    audio_bitrate: 192k
    audio_samplerate: '48000'
output_dir:
  directory: ./output
