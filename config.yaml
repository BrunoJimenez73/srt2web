server:
  host: 127.0.0.1
  port: 8080
  cors_origins:
  - http://localhost:*
  - http://127.0.0.1:*
  auth_token: ''
  rate_limit_rpm: 60
  max_request_size_mb: 100
input:
  type: srt  # srt, file, rtmp
  srt:
    listen_port: 9000
    mode: listener  # listener, caller
    latency_ms: 200
    caller_address: ''
  file:
    path: ''
    loop: false
    speed: 1.0
  rtmp:
    listen_port: 1935
    app: live
    stream_key: stream
output:
  type: web  # web, hls, rtmp, srt, file
  web:
    segment_duration: 10
    list_size: 2
    audio_offset_ms: 0
  hls:  # alias para web
    segment_duration: 10
    list_size: 2
    audio_offset_ms: 0
  rtmp:
    url: rtmp://localhost/live/stream
    video_bitrate: 2500k
    audio_bitrate: 128k
    video_codec: libx264
    preset: medium
    audio_codec: aac
  srt:
    url: srt://localhost:9001
    mode: caller  # caller, listener, rendezvous
    latency_ms: 200
    stream_id: ''
    passphrase: ''
    video_bitrate: 2500k
    audio_bitrate: 128k
    video_codec: libx264
    preset: medium
    audio_codec: aac
  file:
    save_video: true
    save_audio: true
    save_subtitles: true
pipeline:
  chunk_duration_sec: 10
modules:
  audio_extractor:
    enabled: true
  transcriber:
    enabled: true
    model: tiny
    language: en
    device: cuda
    beam_size: 2
  translator:
    enabled: true
    source_lang: en
    target_lang: es
  subtitle_generator:
    enabled: true
    format: webvtt
    use_translated: true
  tts_engine:
    enabled: true
    engine: piper
    device: cuda
    voice: es_MX-ald-medium
    speed: 1.3
  audio_mixer:
    enabled: true
    original_volume: 0.9
    dubbed_volume: 1.0
    tts_volume: 0.9
  video_muxer:
    enabled: true
    hls_segment_duration: 4
    audio_offset_ms: 0
    encoder_mode: gpu_nvenc
    hls_list_size: 6
    video_quality: medium
    video_crf: 26
    audio_codec: aac
    audio_bitrate: 192k
    audio_samplerate: '48000'
output_dir:
  directory: ./output
