server:
  host: 127.0.0.1
  port: 9999
  cors_origins:
  - http://localhost:*
  - http://127.0.0.1:*
  auth_token: ''
  rate_limit_rpm: 60
input:
  type: srt
  srt:
    listen_port: 9000
    mode: listener
    latency_ms: 1000
    caller_address: ''
  file:
    path: dummy.mp4
    loop: false
    speed: 1.0
output:
  type: web
  web:
    segment_duration: 15
    list_size: 6
    audio_offset_ms: 0
pipeline:
  chunk_duration_sec: 15
modules:
  audio_extractor:
    enabled: true
  transcriber:
    enabled: true
    model: tiny
    language: en
    device: auto
  translator:
    enabled: true
    source_lang: en
    target_lang: es
  subtitle_generator:
    enabled: true
    format: webvtt
    use_translated: true
  tts_engine:
    enabled: true
    engine: piper
    device: cpu
    voice: es_ES-davefx-medium
    speed: 1
  audio_mixer:
    enabled: true
    original_volume: 0.7
    dubbed_volume: 1.0
    tts_volume: 1
  video_muxer:
    enabled: true
    hls_segment_duration: 6
    audio_offset_ms: 0
    hls_list_size: 6
    encoder_mode: gpu_nvenc
    video_quality: medium
    video_crf: 26
    audio_codec: aac
    audio_bitrate: 192k
    audio_samplerate: '48000'
output_dir:
  directory: ./output
