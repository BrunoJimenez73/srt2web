name: 🚀 CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'
  POETRY_VERSION: '1.7.0'

# ─── Jobs ────────────────────────────────────────────────────────────────────

jobs:
  # ── 1. Lint & type-check ──────────────────────────────────────────────────

  lint-backend:
    name: 🐍 Lint & Types (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Poetry
        run: pip install poetry==${{ env.POETRY_VERSION }}

      - name: Install dependencies
        run: poetry install --with dev

      - name: Black (format check)
        run: poetry run black --check src/ tests/

      - name: isort (import order)
        run: poetry run isort --check-only src/ tests/

      - name: Flake8 (lint)
        run: poetry run flake8 src/ tests/

      - name: MyPy (types)
        run: poetry run mypy src/

      - name: Bandit (security)
        run: poetry run bandit -r src/ -ll

  lint-frontend:
    name: 🟦 Lint & Types (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript check
        working-directory: frontend
        run: npm run type-check

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: Prettier check
        working-directory: frontend
        run: npx prettier --check src/

  # ── 2. Tests ──────────────────────────────────────────────────────────────

  test-backend:
    name: 🧪 Tests (Python)
    runs-on: ubuntu-latest
    needs: lint-backend

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Poetry
        run: pip install poetry==${{ env.POETRY_VERSION }}

      - name: Install dependencies
        run: poetry install --with dev

      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql+asyncpg://testuser:testpass@localhost/testdb
          SECRET_KEY: test-secret-key-at-least-32-chars!!
          ENVIRONMENT: development
        run: |
          poetry run pytest tests/ \
            -v \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=80

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: backend

  test-frontend:
    name: 🧪 Tests (TypeScript)
    runs-on: ubuntu-latest
    needs: lint-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run tests
        working-directory: frontend
        run: npm test -- --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          directory: frontend/coverage
          flags: frontend

  # ── 3. Build ──────────────────────────────────────────────────────────────

  build-frontend:
    name: 🏗️ Build (Astro)
    runs-on: ubuntu-latest
    needs: [lint-frontend, test-frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          PUBLIC_API_URL: ${{ secrets.API_URL }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ── 4. Security scan ──────────────────────────────────────────────────────

  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    needs: [lint-backend, lint-frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Python dependency audit (pip-audit)
        run: |
          pip install pip-audit
          pip-audit --requirement <(pip install poetry && poetry export -f requirements.txt) || true

      - name: npm audit
        working-directory: frontend
        run: npm audit --audit-level=high

  # ── 5. Deploy (solo en main) ──────────────────────────────────────────────

  deploy:
    name: 🚢 Deploy to Production
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://example.com

    steps:
      - uses: actions/checkout@v4

      - name: Download frontend artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Deploy frontend
        run: echo "🚀 Desplegando frontend..."
        # Aquí va tu comando de deploy (Vercel, Netlify, etc.)

      - name: Deploy backend
        run: echo "🚀 Desplegando backend..."
        # Aquí va tu comando de deploy (Railway, Fly.io, etc.)

      - name: Post-deploy health check
        run: |
          for i in {1..5}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://api.example.com/health)
            if [ "$STATUS" = "200" ]; then
              echo "✅ Health check OK"
              exit 0
            fi
            echo "Intento $i fallido (status $STATUS), reintentando..."
            sleep 10
          done
          echo "❌ Health check falló" && exit 1

      - name: Notify on failure
        if: failure()
        run: echo "❌ Deploy falló — notificar al equipo"
