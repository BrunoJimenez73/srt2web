# Workflow Pipeline Configuration
# Define cómo se ejecutan las sesiones de desarrollo.

mode: standard # core | standard | enhanced

validators:
  pytest:
    required: true
    timeout: 180
    category: "not slow"

  mypy:
    required: true
    paths: ["core/", "server/"]
    strict: true

  ruff:
    required: true
    paths: ["core/", "modules/", "server/", "tests/"]

  tsc:
    required: false
    warn_only: true
    path: "frontend"

  feature_list:
    required: true

  checkpoints:
    required: true

session:
  auto_commit: true
  auto_push: false
  commit_message_template: "feat({id}): {title}"
