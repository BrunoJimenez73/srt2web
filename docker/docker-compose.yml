services:
  srt2web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "9999:9999"
    volumes:
      - ../config.yaml:/app/config.yaml
      - ../output:/app/output
      - ../models:/app/models
    environment:
      - SRT2WEB_DMR_ENABLED=true
      - SRT2WEB_DMR_MODEL=ai/gemma4:E4B
    models:
      - gemma_translator
    depends_on:
      - dmr-setup

  dmr-setup:
    image: alpine:latest
    command: >
      sh -c "echo 'DMR model configured via Compose models below'"
    restart: "no"

models:
  gemma_translator:
    model: ai/gemma4:E4B
    context_size: 131072
    runtime_flags:
      - "--temp"
      - "0.1"
      - "--mlock"
      - "--batch-size"
      - "2048"
      - "--threads"
      - "8"
