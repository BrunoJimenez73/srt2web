[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

asyncio_mode = auto

addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    -p no:mcp
    -p asyncio
    --ignore=tests/unit/test_async_pipeline.py
    --basetemp=tests/temp

markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    e2e: marks tests as end-to-end tests
    live: marks tests that require live server (skip by default)
    unit: unit tests
    asyncio: asyncio tests
    api: API tests
    websocket: WebSocket tests
    security: security tests
    gpu: GPU tests
    cpu: CPU tests
    tui: TUI tests
    contract: contract tests
    benchmark: benchmark tests
    benchmark: benchmark tests

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

[coverage:run]
source = .
omit =
    tests/*
    */site-packages/*
    */__pycache__/*

[coverage:report]
precision = 2
show_missing = True
